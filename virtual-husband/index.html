<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가상남편</title>
<meta name="description" content="대화할수록 오늘 저녁 메뉴가 정해지는 남편 다마고치.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #ffffff;
  --ink: #1d2230;
  --mute: #6b7285;
  --line: #e8eaf0;
  --sky: #7dd3fc;
  --lilac: #c4b5fd;
  --rose: #fb7185;
  --honey: #fbbf24;
  --stage-a: #e0f2fe;
  --stage-b: #ede9fe;
  --radius: 22px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }

.app {
  max-width: 460px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: max(14px, env(safe-area-inset-top)) 16px 0;
}

/* 상단 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px 12px; }
.title { font-family: 'Jua', sans-serif; font-size: 26px; letter-spacing: -0.01em; margin: 0; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.badge { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: #f4f5f9; color: var(--mute); }
.badge b { color: var(--ink); font-weight: 700; }

.gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 0 2px 14px; }
.gauge label { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--mute); margin-bottom: 5px; }
.gauge .bar { height: 8px; border-radius: 99px; background: #eef0f5; overflow: hidden; }
.gauge .bar i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width .5s ease; }
.g-love i { background: linear-gradient(90deg, #fda4af, var(--rose)); }
.g-full i { background: linear-gradient(90deg, #fde68a, var(--honey)); }

main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.tab { display: none; flex: 1; min-height: 0; flex-direction: column; }
.tab.on { display: flex; }

/* 집 */
.stage {
  position: relative;
  height: min(54dvh, 400px);
  border-radius: var(--radius);
  background: linear-gradient(160deg, var(--stage-a), var(--stage-b));
  overflow: hidden;
  transition: background .6s ease;
}
.stage[data-slot="morning"] { --stage-a: #e0f2fe; --stage-b: #fef9c3; }
.stage[data-slot="day"]     { --stage-a: #e0f2fe; --stage-b: #ede9fe; }
.stage[data-slot="evening"] { --stage-a: #ffedd5; --stage-b: #fce7f3; }
.stage[data-slot="night"]   { --stage-a: #c7d2fe; --stage-b: #ddd6fe; }
.floor { position: absolute; left: 0; right: 0; bottom: 0; height: 14%; background: rgba(255,255,255,.55); }
.char {
  position: absolute; left: 50%; bottom: 0;
  transform: translateX(-50%);
  max-width: 82%; max-height: 80%;
  width: auto; height: auto;
  object-fit: contain;
  user-select: none; -webkit-user-drag: none;
}
.char.hop { animation: hop .4s ease; }
@keyframes hop { 0%,100% { transform: translateX(-50%) translateY(0); } 40% { transform: translateX(-50%) translateY(-14px); } }
.bubble {
  position: absolute; top: 14px; left: 14px; right: 14px;
  background: #fff; border-radius: 18px;
  padding: 11px 15px;
  font-family: 'Jua', sans-serif; font-size: 18px; line-height: 1.4;
  box-shadow: 0 6px 20px rgba(80, 70, 140, .12);
  min-height: 3.2em;
  display: flex; align-items: center; white-space: pre-line;
}
.bubble::after {
  content: ''; position: absolute; left: 50%; bottom: -7px; width: 14px; height: 14px;
  background: #fff; transform: translateX(-50%) rotate(45deg); border-radius: 3px;
}
.bubble.serious { font-family: 'Noto Sans KR', sans-serif; font-weight: 500; font-size: 16px; }
.mood-tag { position: absolute; left: 12px; bottom: 10px; font-size: 12px; padding: 3px 10px; border-radius: 99px; background: rgba(255,255,255,.8); }

.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.act {
  border: 1px solid var(--line); background: #fff; border-radius: 16px;
  padding: 11px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 13px; font-weight: 500;
  transition: transform .12s ease, background .12s ease;
}
.act span { font-size: 22px; line-height: 1.2; }
.act:active { transform: scale(.95); background: #f6f7fb; }
.hint { text-align: center; color: var(--mute); font-size: 12.5px; margin: 12px 0 0; }

/* 대화 */
.log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px 10px; }
.msg { max-width: 82%; padding: 9px 14px; border-radius: 18px; word-break: keep-all; overflow-wrap: anywhere; }
.msg.him { align-self: flex-start; background: #f1f2f8; border-bottom-left-radius: 6px; font-family: 'Jua', sans-serif; font-size: 17px; }
.msg.him.serious { font-family: 'Noto Sans KR', sans-serif; font-size: 15px; }
.msg.him.mimic { white-space: pre-line; background: #fdf2f8; font-size: 15px; letter-spacing: .02em; font-style: italic; }
.msg.me { align-self: flex-end; background: linear-gradient(135deg, #bae6fd, #ddd6fe); border-bottom-right-radius: 6px; font-size: 15px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 7px 13px; font-size: 14px; }
.chip:active { background: #f6f7fb; }
.send { display: flex; gap: 8px; padding-bottom: 8px; }
.send input {
  flex: 1; min-width: 0; font: inherit; font-size: 16px;
  border: 1px solid var(--line); border-radius: 99px; padding: 11px 16px; background: #fff; color: var(--ink);
}
.send button { border: 0; border-radius: 99px; padding: 0 18px; background: var(--ink); color: #fff; font-weight: 700; }
.progress { font-size: 12.5px; color: var(--mute); text-align: center; padding: 2px 0 6px; }

/* 메뉴 */
.menu { flex: 1; overflow-y: auto; padding: 4px 2px 14px; }
.locked { text-align: center; padding: 48px 12px; }
.locked .big { font-size: 54px; margin-bottom: 8px; }
.locked h2 { font-family: 'Jua', sans-serif; font-size: 22px; margin: 0 0 6px; font-weight: 400; }
.locked p { margin: 0; color: var(--mute); font-size: 14.5px; }
.dots { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: #eceef4; }
.dots i.on { background: linear-gradient(135deg, var(--sky), var(--lilac)); }

.pick { border-radius: var(--radius); padding: 22px 20px; background: linear-gradient(150deg, #e0f2fe, #ede9fe 60%, #fce7f3); position: relative; }
.pick .lead { font-size: 13px; color: var(--mute); margin: 0 0 4px; }
.pick .food { font-family: 'Jua', sans-serif; font-size: 40px; line-height: 1.15; margin: 0; font-weight: 400; }
.pick .drink { margin: 6px 0 0; font-size: 15px; }
.pick .fri { display: inline-block; margin-top: 10px; font-size: 12.5px; background: #fff; border-radius: 99px; padding: 3px 10px; }
.reason { margin: 14px 0 0; padding: 12px 14px; background: rgba(255,255,255,.75); border-radius: 14px; font-family: 'Jua', sans-serif; font-size: 17px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 12px; font-weight: 500; }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 700; }
.btn[disabled] { opacity: .45; cursor: default; }
.info { margin-top: 12px; border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; font-size: 14.5px; }
.info small { display: block; color: var(--mute); font-size: 12.5px; margin-bottom: 2px; }
.note { margin: 14px 2px 0; font-size: 12.5px; color: var(--mute); }

/* 인스타 링크 카드 */
.wish { align-self: flex-start; max-width: 84%; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: #fff; }
.wish .ph { padding: 14px; background: linear-gradient(135deg, #fde68a, #fda4af 55%, #c4b5fd); font-size: 13px; color: #fff; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.18); }
.wish .bd { padding: 10px 14px 12px; }
.wish .bd b { display: block; font-size: 17px; font-family: 'Jua', sans-serif; font-weight: 400; }
.wish .bd span { font-size: 13px; color: var(--mute); }
.wish .ans { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.wish .ans button { border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 8px; font-size: 14px; }
.wish .ans button.y { background: var(--ink); color: #fff; border-color: var(--ink); }
.wish .done { margin-top: 8px; font-size: 13px; color: var(--mute); }

/* 하단 탭 */
nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px 0 max(10px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); margin-top: 4px; background: #fff; }
nav button { border: 0; background: none; padding: 7px 0; border-radius: 12px; font-size: 13px; color: var(--mute); position: relative; }
nav button span { display: block; font-size: 21px; line-height: 1.2; }
nav button[aria-selected="true"] { color: var(--ink); font-weight: 700; background: #f4f5f9; }
nav .dot { position: absolute; top: 4px; right: calc(50% - 26px); width: 9px; height: 9px; border-radius: 50%; background: var(--rose); display: none; }
nav .dot.on { display: block; }

.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(10px); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 99px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; max-width: 90vw; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) {
  .char.hop { animation: none; }
  * { transition: none !important; }
}
@media (max-height: 640px) { .stage { height: 42dvh; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="title">가상남편</h1>
    <div class="badges">
      <span class="badge" id="b-slot"></span>
      <span class="badge">오늘 기분 <b id="b-mood"></b></span>
    </div>
  </header>
  <div class="gauges">
    <div class="gauge g-love"><label><span>애정</span><span id="n-love"></span></label><div class="bar"><i id="f-love"></i></div></div>
    <div class="gauge g-full"><label><span>배부름</span><span id="n-full"></span></label><div class="bar"><i id="f-full"></i></div></div>
  </div>

  <main>
    <section class="tab on" id="tab-home" role="tabpanel">
      <div class="stage" id="stage" data-slot="day">
        <div class="bubble" id="bubble" aria-live="polite"></div>
        <div class="floor"></div>
        <img class="char" id="char" alt="남편 캐릭터" src="img/idle.webp">
      </div>
      <div class="actions">
        <button class="act" data-act="poke"><span>👉</span>찌르기</button>
        <button class="act" data-act="pet"><span>🫳</span>쓰다듬기</button>
        <button class="act" data-act="touch"><span>🙈</span>XX 만지기</button>
        <button class="act" data-act="nip"><span>🫣</span>찌찌 만지기</button>
        <button class="act" data-act="feed"><span>🍙</span>밥주기</button>
      </div>
      <p class="hint">가끔 반격이 날아와요.</p>
    </section>

    <section class="tab" id="tab-chat" role="tabpanel">
      <div class="log" id="log" aria-live="polite"></div>
      <div class="progress" id="progress"></div>
      <div class="chips" id="chips"></div>
      <form class="send" id="form" autocomplete="off">
        <input id="text" type="text" maxlength="120" placeholder="남편에게 말 걸기" aria-label="남편에게 보낼 말">
        <button type="submit">보내기</button>
      </form>
    </section>

    <section class="tab" id="tab-menu" role="tabpanel">
      <div class="menu" id="menu"></div>
    </section>
  </main>

  <nav role="tablist">
    <button role="tab" data-tab="home" aria-selected="true"><span>🛋️</span>집</button>
    <button role="tab" data-tab="chat" aria-selected="false"><span>💬</span>대화</button>
    <button role="tab" data-tab="menu" aria-selected="false"><span>🍽️</span>오늘 메뉴<i class="dot" id="dot"></i></button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="logic.js"></script>
<script>
(function () {
  'use strict';
  var KEY = 'vh-state-v1';
  var rng = Math.random;
  var $ = function (id) { return document.getElementById(id); };

  /* ── 저장 ── */
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return s; } catch (e) {}
    return null;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  var now = new Date();
  var S = load() || VH.defaultState(VH.dayKey(now), now.getTime(), rng);
  VH.rollDay(S, VH.dayKey(now), rng);
  S.chat = S.chat || [];
  S.shown = S.shown || [];
  S.history = S.history || [];

  var override = null, overrideTimer = null, homeText = '', homeSerious = false;

  function slot() { return VH.slotFromHour(new Date().getHours()); }
  function clamp(n) { return Math.max(0, Math.min(100, n)); }
  function toast(t) {
    var el = $('toast'); el.textContent = t; el.classList.add('on');
    clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('on'); }, 2200);
  }
  function setLast(n) { if (n) S.lastNick = n; }

  /* ── 집 화면 ── */
  function renderHome() {
    var sl = slot(), nowMs = Date.now();
    VH.rollDay(S, VH.dayKey(new Date()), rng);
    $('stage').setAttribute('data-slot', sl);
    $('b-slot').textContent = VH.SLOT_LABEL[sl];
    $('b-mood').textContent = VH.MOOD_LABEL[S.mood];
    var full = VH.fullnessNow(S, nowMs);
    $('f-love').style.width = S.affection + '%'; $('n-love').textContent = S.affection;
    $('f-full').style.width = full + '%'; $('n-full').textContent = full;
    var img = override || VH.sceneFor(sl, S.mood);
    var el = $('char');
    var src = 'img/' + img + '.webp';
    if (el.getAttribute('src') !== src) el.setAttribute('src', src);
    var b = $('bubble');
    b.textContent = homeText;
    b.classList.toggle('serious', homeSerious);
    var unlocked = S.chatCount >= VH.UNLOCK_AT;
    $('dot').classList.toggle('on', unlocked && !S.menuSeen);
  }
  function say(text, img, ms) {
    homeText = text; homeSerious = false;
    if (img) {
      override = img;
      clearTimeout(overrideTimer);
      overrideTimer = setTimeout(function () { override = null; renderHome(); }, ms || 3200);
      var c = $('char'); c.classList.remove('hop'); void c.offsetWidth; c.classList.add('hop');
    }
    renderHome();
  }
  function settle(isFirst) {
    var sl = slot();
    var g = isFirst ? VH.greeting(sl, rng, S.lastNick) : VH.idleLine(S.mood, VH.fullnessNow(S, Date.now()) < 30, rng, S.lastNick);
    setLast(g.nick);
    homeText = g.text; homeSerious = false;
  }

  function act(kind) {
    var nowMs = Date.now();
    if (kind === 'feed' && VH.fullnessNow(S, nowMs) >= 95) {
      var f = VH.attachNickname(VH.LINES.full[Math.floor(rng() * VH.LINES.full.length)], rng, { prob: .4, last: S.lastNick });
      setLast(f.nick); say(f.text, 'sulk'); return;
    }
    if (VH.rollAttack(rng)) {
      var a = VH.attack(rng, S.lastNick);
      setLast(a.nick); S.affection = clamp(S.affection - 2);
      say(a.text, a.img, 3800); save(); return;
    }
    if (kind === 'poke' && rng() < (hungryNow() ? 0.4 : 0.1)) { doMimic(); return; }
    var r = VH.reaction(kind, rng, S.lastNick);
    setLast(r.nick);
    if (kind === 'poke') S.affection = clamp(S.affection + 1);
    if (kind === 'pet') { S.affection = clamp(S.affection + 4); if (rng() < .3) S.mood = 'happy'; }
    if (kind === 'touch' || kind === 'nip') S.affection = clamp(S.affection - 1);
    if (kind === 'feed') { VH.feed(S, nowMs); S.affection = clamp(S.affection + 3); }
    say(r.text, r.img); save();
  }

  /* ── 대화 ── */
  var CHIPS = ['오늘 힘들었어', '피곤해', '기분 좋아!', '심심해', '저녁 뭐 먹지?', '사랑해', '나를 사랑해라!', '안아줘라!', '뽀뽀해조라!', '간단하게 먹을까?', '대출 서류 챙겨야 해'];

  function addMsg(who, text, serious) {
    S.chat.push({ who: who, text: text, s: !!serious });
    if (S.chat.length > 60) S.chat = S.chat.slice(-60);
  }
  function renderLog() {
    var log = $('log'); log.textContent = '';
    S.chat.forEach(function (m, idx) {
      if (m.who === 'wish') { log.appendChild(wishCard(m, idx)); return; }
      var d = document.createElement('div');
      d.className = 'msg ' + (m.who === 'me' ? 'me' : 'him' + (m.s ? ' serious' : '') + (m.mimic ? ' mimic' : ''));
      d.textContent = m.text; log.appendChild(d);
    });
    log.scrollTop = log.scrollHeight;
    var left = Math.max(0, VH.UNLOCK_AT - S.chatCount);
    $('progress').textContent = left > 0 ? '오늘 메뉴까지 대화 ' + left + '번 남았어요' : '오늘 메뉴가 정해졌어요';
  }
  function wishCard(m, idx) {
    var c = document.createElement('div'); c.className = 'wish';
    var ph = document.createElement('div'); ph.className = 'ph'; ph.textContent = '📸 인스타그램에서 공유함';
    var bd = document.createElement('div'); bd.className = 'bd';
    var b = document.createElement('b'); b.textContent = m.item;
    var sp = document.createElement('span'); sp.textContent = m.note;
    bd.appendChild(b); bd.appendChild(sp);
    if (m.answer == null) {
      var ans = document.createElement('div'); ans.className = 'ans';
      [['y', '사줄게'], ['n', '다음에']].forEach(function (a) {
        var bt = document.createElement('button'); bt.type = 'button';
        bt.className = a[0]; bt.textContent = a[1];
        bt.addEventListener('click', function () { answerWish(idx, a[0] === 'y'); });
        ans.appendChild(bt);
      });
      bd.appendChild(ans);
    } else {
      var dn = document.createElement('div'); dn.className = 'done';
      dn.textContent = m.answer ? '사주기로 했어요' : '다음에 사주기로 했어요';
      bd.appendChild(dn);
    }
    c.appendChild(ph); c.appendChild(bd); return c;
  }
  function answerWish(idx, yes) {
    var m = S.chat[idx]; if (!m || m.answer != null) return;
    m.answer = yes;
    S.affection = clamp(S.affection + (yes ? 5 : -1));
    var r = VH.wishAnswer(yes, rng, S.lastNick); setLast(r.nick);
    addMsg('him', r.text); homeText = r.text; homeSerious = false;
    save(); renderLog(); renderHome();
  }
  /* 보미 목소리를 얇게 흉내 내고 바로 자기가 대답하는 장난 */
  var mimicBusy = false;
  function hungryNow() { return VH.fullnessNow(S, Date.now()) < 40; }
  function doMimic() {
    if (mimicBusy) return; mimicBusy = true;
    var m = VH.mimic(rng);
    /* 한 사람이 1인 2역: 흉내 내는 말과 자기 대답이 한 번에 같이 나온다 */
    S.chat.push({ who: 'him', text: '(보미 목소리 흉내)\n' + m.voice + '\n' + m.answer, mimic: true });
    S.affection = clamp(S.affection + 1);
    homeText = m.voice + '\n' + m.answer; homeSerious = false; override = 'tease';
    save(); renderHome(); renderLog();
    setTimeout(function () { override = null; mimicBusy = false; renderHome(); }, 3800);
  }
  function maybeWish() {
    if (S.wishToday || S.chatCount < 2 || rng() > 0.35) return;
    S.wishToday = true;
    var w = VH.wish(rng); setLast(w.nick);
    addMsg('him', w.text);
    S.chat.push({ who: 'wish', item: w.item, note: w.note, answer: null });
    toast('남편이 인스타 링크를 보냈어요');
  }
  function send(text) {
    text = String(text || '').trim();
    if (!text) return;
    var wasLocked = S.chatCount < VH.UNLOCK_AT;
    S.chatCount++;
    S.affection = clamp(S.affection + 2);
    addMsg('me', text);
    var r = VH.reply(text, { count: S.chatCount, unlocked: S.chatCount > VH.UNLOCK_AT, last: S.lastNick, slot: slot() }, rng);
    setLast(r.nick);
    if (r.mood) S.mood = r.mood;
    addMsg('him', r.text, r.serious);
    if (wasLocked && S.chatCount >= VH.UNLOCK_AT && !S.unlockAnnounced) {
      S.unlockAnnounced = true; S.menuSeen = false;
      var u = VH.LINES.unlock[0];
      addMsg('him', u);
      toast('오늘 메뉴가 정해졌어요');
    }
    homeText = r.text; homeSerious = r.serious;
    if (r.topic !== 'practical') maybeWish();
    if (r.topic !== 'practical' && rng() < (hungryNow() ? 0.3 : 0.08)) doMimic();
    save(); renderLog(); renderHome(); renderMenu();
  }

  /* ── 메뉴 ── */
  function ensurePick() {
    if (S.pick) return;
    var d = new Date();
    var ex = VH.recentFoods(S.history, VH.dayKey(d), 3);
    S.shown.forEach(function (x) { ex.add(x); });
    S.pick = VH.recommend({ mood: S.mood, dow: d.getDay(), exclude: ex }, rng);
    S.shown.push(S.pick.food);
    S.pick.date = VH.dateIdea(S.mood, rng);
    save();
  }
  function renderMenu() {
    var m = $('menu'); m.textContent = '';
    function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

    if (S.chatCount < VH.UNLOCK_AT) {
      var l = el('div', 'locked');
      l.appendChild(el('div', 'big', '🤔'));
      l.appendChild(el('h2', null, '아직 고민 중이닷'));
      l.appendChild(el('p', null, '대화를 ' + VH.UNLOCK_AT + '번 나누면 오늘 저녁 메뉴를 정해줘요.'));
      var dots = el('div', 'dots');
      for (var i = 0; i < VH.UNLOCK_AT; i++) dots.appendChild(el('i', i < S.chatCount ? 'on' : ''));
      l.appendChild(dots);
      var go = el('button', 'btn primary', '대화하러 가기');
      go.style.marginTop = '22px'; go.style.padding = '12px 22px';
      go.addEventListener('click', function () { tab('chat'); });
      l.appendChild(go);
      m.appendChild(l); return;
    }
    ensurePick();
    var p = S.pick;
    var card = el('div', 'pick');
    card.appendChild(el('p', 'lead', '오늘 저녁은'));
    card.appendChild(el('h2', 'food', p.food));
    card.appendChild(el('p', 'drink', '음료는 ' + p.drink));
    if (p.friday) card.appendChild(el('span', 'fri', '금요일 고정 메뉴'));
    card.appendChild(el('div', 'reason', p.reason));
    m.appendChild(card);

    if (!p.orderTitle && p.brand) p.orderTitle = p.brand + '로 시켜요';
    if (p.orderTitle) {
      var ord = el('div', 'info');
      ord.appendChild(el('small', null, '주문 메모'));
      var t = el('b', null, p.orderTitle); t.style.display = 'block'; t.style.marginBottom = '4px';
      ord.appendChild(t);
      (p.notes || []).forEach(function (n) { var li = el('div', null, '· ' + n); li.style.fontSize = '14px'; ord.appendChild(li); });
      m.appendChild(ord);
    }
    var info = el('div', 'info');
    info.appendChild(el('small', null, '오늘 기분'));
    info.appendChild(document.createTextNode(VH.MOOD_LABEL[S.mood]));
    m.appendChild(info);
    var di = el('div', 'info');
    di.appendChild(el('small', null, '데이트 아이디어'));
    di.appendChild(document.createTextNode(p.date));
    m.appendChild(di);

    var row = el('div', 'row');
    var re = el('button', 'btn', '다른 메뉴 보기');
    if (p.friday || S.confirmed) re.disabled = true;
    re.addEventListener('click', function () {
      S.pick = null; ensurePick(); renderMenu();
    });
    var ok = el('button', 'btn primary', S.confirmed ? '정했어요' : '이걸로 정했어');
    if (S.confirmed) ok.disabled = true;
    ok.addEventListener('click', function () {
      S.confirmed = true;
      S.history.push({ day: VH.dayKey(new Date()), food: S.pick.food });
      var c = VH.LINES.confirm[Math.floor(rng() * VH.LINES.confirm.length)];
      addMsg('him', c); homeText = c; homeSerious = false;
      save(); renderMenu(); renderLog(); renderHome();
      toast('진짜 남편한테 가서 말해보세요!');
    });
    row.appendChild(re); row.appendChild(ok);
    m.appendChild(row);
    m.appendChild(el('p', 'note', '이 메뉴를 들고 진짜 남편에게 가볼까요?'));
    S.menuSeen = true; save(); $('dot').classList.remove('on');
  }

  /* ── 탭 ── */
  function tab(name) {
    ['home', 'chat', 'menu'].forEach(function (t) {
      $('tab-' + t).classList.toggle('on', t === name);
    });
    document.querySelectorAll('nav button').forEach(function (b) {
      b.setAttribute('aria-selected', b.dataset.tab === name ? 'true' : 'false');
    });
    if (name === 'chat') renderLog();
    if (name === 'menu') renderMenu();
    if (name === 'home') renderHome();
  }

  /* ── 시작 ── */
  var chips = $('chips');
  CHIPS.forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = c;
    b.addEventListener('click', function () { send(c); });
    chips.appendChild(b);
  });
  $('form').addEventListener('submit', function (e) {
    e.preventDefault(); var i = $('text'); send(i.value); i.value = '';
  });
  document.querySelectorAll('.act').forEach(function (b) {
    b.addEventListener('click', function () { act(b.dataset.act); });
  });
  document.querySelectorAll('nav button').forEach(function (b) {
    b.addEventListener('click', function () { tab(b.dataset.tab); });
  });

  var first = !S.greeted || S.greeted !== S.day;
  settle(first);
  if (first) {
    S.greeted = S.day;
    addMsg('him', homeText);
    save();
  }
  renderHome(); renderLog(); renderMenu();
  setInterval(function () { renderHome(); }, 60000);
})();
</script>
</body>
</html>
